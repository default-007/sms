{% extends "core/base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title|default:"Communication Preferences" }}{% endblock %}

{% block content %}
<div class="container-fluid">
  <h3 class="mb-4">{{ title|default:"Communication Preferences" }}</h3>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Save Preferences</button>
          <a href="{% url 'communications:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
