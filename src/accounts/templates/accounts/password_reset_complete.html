{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body text-center p-5">
          <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
          <h4 class="mt-3">Password Reset Complete</h4>
          <p class="text-muted">
            Your password has been set successfully. You can now sign in with your
            new password.
          </p>
          <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">
            <i class="fas fa-sign-in-alt me-1"></i> Go to Login
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
